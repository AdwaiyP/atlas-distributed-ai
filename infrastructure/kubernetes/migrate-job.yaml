apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-migrate
  namespace: atlas
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: atlas-api:latest
          imagePullPolicy: Never
          command:
            - python
            - -m
            - alembic
            - -c
            - backend/alembic.ini
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-db-secret
                  key: DATABASE_URL
