apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atlas
spec:
  clusterIP: None
  selector:
    app: atlas-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlas-postgres
  namespace: atlas
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: atlas-postgres
  template:
    metadata:
      labels:
        app: atlas-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: atlas-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
