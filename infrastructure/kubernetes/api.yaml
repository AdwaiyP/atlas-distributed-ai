apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
    spec:
      containers:
        - name: api
          image: atlas-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  namespace: atlas
spec:
  selector:
    app: atlas-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
